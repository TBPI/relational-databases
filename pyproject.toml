[project]
name = "learning-sql"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "TBPI" }
]
requires-python = ">=3.12"
dependencies = [
    "jupysql>=0.11.1",
    "pgspecial>=2.2.1",
    "psycopg[binary]>=3.3.6",
]

[project.scripts]
learning-sql = "learning_sql:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
